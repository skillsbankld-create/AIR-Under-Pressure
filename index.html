<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIR Under Pressure — Meeting Roleplay</title>
<style>
  :root {
    --navy: #1B2A4A;
    --navy-dark: #0F1D33;
    --teal: #0D9488;
    --teal-panel: #F0FDFA;
    --coral: #F4845F;
    --coral-panel: #FFF1EB;
    --offwhite: #F8FAFC;
    --white: #FFFFFF;
    --text: #1B2A4A;
    --border: #D9E2EC;

    --analyze: #F26A44;
    --analyze-light: #F7AD98;
    --analyze-panel: #FDF0EC;
    --involve: #40BDA9;
    --involve-light: #95DACF;
    --involve-panel: #EBF8F6;
    --reflect: #4D88E8;
    --reflect-light: #9DBDF2;
    --reflect-panel: #EDF3FC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    background: var(--navy);
    color: var(--offwhite);
  }
  .header {
    background: var(--navy);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header img { height: 40px; }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 18px 80px;
  }
  h1 {
    font-size: 1.3rem;
    color: var(--white);
    margin: 0 0 6px;
  }
  h2 {
    font-size: 1.05rem;
    color: var(--navy);
    margin: 0 0 10px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .panel {
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .panel-teal { background: var(--teal-panel); }
  .panel-coral { background: var(--coral-panel); }
  .panel-analyze { background: var(--analyze-panel); }
  .panel-involve { background: var(--involve-panel); }
  .panel-reflect { background: var(--reflect-panel); }
  .panel-title {
    font-weight: bold;
    margin: 0 0 6px;
  }
  .panel-teal .panel-title { color: var(--teal); }
  .panel-coral .panel-title { color: var(--coral); }
  .panel p, .panel-hint { margin: 0 0 8px; }
  .panel-hint { font-style: italic; font-size: 0.88rem; color: #475569; }
  .balloon-wrap { text-align: center; margin-bottom: 6px; }
  .balloon-svg { width: 110px; height: 140px; display: inline-block; }
  .role-line {
    font-weight: bold;
    background: var(--offwhite);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 16px;
    color: var(--text);
  }
  textarea, .text-input {
    width: 100%;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 0.98rem;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
    margin-top: 6px;
    background: var(--white);
  }
  textarea { min-height: 70px; }
  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .choice:last-child { border-bottom: none; }
  .choice input[type=checkbox] {
    margin-top: 4px;
    width: 18px; height: 18px;
    flex-shrink: 0;
  }
  .choice label { font-size: 0.98rem; }
  .choice b { color: var(--navy); }
  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    padding: 13px 20px;
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
  }
  .btn-primary { background: var(--teal); color: var(--white); }
  .btn-primary:hover { background: #0b7a70; }
  .btn-secondary { background: #33507F; color: var(--white); border: 1px solid rgba(255,255,255,0.25); }
  .btn-secondary:hover { background: #3D5D92; }
  .btn-outline {
    background: transparent;
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.5);
    font-weight: normal;
  }
  .step-label {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
    font-weight: bold;
    letter-spacing: 0.02em;
  }
  .timer-wrap {
    text-align: center;
    margin: 14px 0;
  }
  .timer-display {
    font-size: 2.6rem;
    font-weight: bold;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
  }
  .timer-display .unit {
    font-size: 1.1rem;
    font-weight: normal;
    margin-left: 4px;
  }
  .timer-display.warn { color: var(--coral); }
  .timer-caption {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.65);
    margin-top: 2px;
  }
  .restart-link {
    text-align: center;
    margin-top: 26px;
    font-size: 0.85rem;
  }
  .restart-link a { color: rgba(255,255,255,0.65); text-decoration: underline; cursor: pointer; }
  .center { text-align: center; }
  .resume-box {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    margin-top: 18px;
    color: var(--text);
  }
  .person-btn {
    background: var(--white);
    border: 2px solid var(--navy);
    color: var(--navy);
    padding: 22px;
    font-size: 1.15rem;
  }
  .person-btn:hover { background: #33507F; color: var(--white); border-color: #33507F; }
  .review-block {
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .review-block:last-child { border-bottom: none; }
  .review-q { font-weight: bold; color: var(--navy); margin: 10px 0 2px; font-size: 0.92rem; }
  .review-a { margin: 0 0 6px; white-space: pre-wrap; }
  .review-a.empty { color: #94a3b8; font-style: italic; }
</style>
</head>

<div class="wrap" id="app"></div>

<script>
const SCENARIOS = {
  1: {
    reader: {
      roleLine: "You are a team lead. Your role is to manage this project and talk to the client.",
      whatYouKnow: "The report's data comes from an outside company. That company already agreed to the original two-week date and cannot go faster. You know this from managing the client relationship. The other person has no reason to know it.",
      script: "I just got off a call with the client. They want the report moved up. They need it in one week, not two. I told them we could do it. I need you to confirm today that your side can deliver by Friday."
    },
    responder: {
      roleLine: "You are a team member. Your role is to do the work needed for this project.",
      involve: [
        {name:"Sara", desc:"Talks to the outside company that gives us the data. She knows their schedule and if they can move faster."},
        {name:"Nadia", desc:"Works with the other department on this project. She knows if her team has time this week."},
        {name:"Omar", desc:"Is new here. He worked with this client at his old company, but he does not know our current policies yet."}
      ]
    }
  },
  2: {
    reader: {
      roleLine: "You are a team member from another team. Your role is to lead the work for your own team.",
      whatYouKnow: "Your team already has a deadline next week on something else. That is why adding more work now feels risky to you. The other person has no way of knowing that, since they are not on your team.",
      script: "Your plan means more work for my team. We are already busy this month. I am not sure we can do this too."
    },
    responder: {
      roleLine: "You are a project lead. Your role is to present a plan for a new project.",
      involve: [
        {name:"Farah", desc:"Helped build this plan with me. She knows what it actually asks of other teams."},
        {name:"Khaled", desc:"Has worked with this team before. He knows how they usually plan their work."},
        {name:"Tariq", desc:"Handles the budget for this team. He knows if there is money for more work, but not if there is time."}
      ]
    }
  }
};

const PERSON_ROLES = {
  person1: {1: 'reader', 2: 'responder'},
  person2: {1: 'responder', 2: 'reader'}
};

const READER_STEPS = ['info', 'wait'];
const RESPONDER_STEPS = ['opening', 'analyze', 'involve', 'respond', 'wait', 'reflect'];

let person = null;
let state = null;
let timerInterval = null;

// ---------- BALLOON SVG ----------

function balloonSVG(letter, label, color, lightColor) {
  const gid = 'grad-' + letter;
  return `
    <svg class="balloon-svg" viewBox="0 0 140 175" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${lightColor}"/>
          <stop offset="100%" stop-color="${color}"/>
        </linearGradient>
      </defs>
      <path d="M70,6 C106,6 124,34 124,66 C124,106 94,138 70,150 C46,138 16,106 16,66 C16,34 34,6 70,6 Z" fill="url(#${gid})"/>
      <line x1="70" y1="150" x2="70" y2="166" stroke="${color}" stroke-width="3"/>
      <circle cx="70" cy="170" r="5" fill="${color}"/>
      <text x="70" y="${label ? 66 : 76}" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff" font-family="Calibri, Arial, sans-serif">${letter}</text>
      ${label ? `<text x="70" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" font-family="Calibri, Arial, sans-serif">${label}</text>` : ''}
    </svg>
  `;
}

function storageKey(p) { return 'airActivity_' + p; }

function freshState() {
  return {
    round: 1,
    stepIndex: 0,
    screen: 'round', // 'round' | 'roundComplete' | 'review' | 'done'
    answers: {
      1: { analyze: '', involveChecked: [], involveReason: '', respond: '', reflect1: '', reflect2: '' },
      2: { analyze: '', involveChecked: [], involveReason: '', respond: '', reflect1: '', reflect2: '' }
    }
  };
}

function save() {
  localStorage.setItem(storageKey(person), JSON.stringify(state));
}

function load(p) {
  const raw = localStorage.getItem(storageKey(p));
  return raw ? JSON.parse(raw) : null;
}

function clearProgress(p) {
  localStorage.removeItem(storageKey(p));
}

function roleFor(p, round) {
  return PERSON_ROLES[p][round];
}

function stepsFor(role) {
  return role === 'reader' ? READER_STEPS : RESPONDER_STEPS;
}

function restartLink() {
  return '<div class="restart-link"><a onclick="doRestart()">Restart this activity</a></div>';
}

function doRestart() {
  if (confirm('This will clear your saved answers and start over. Continue?')) {
    clearProgress(person);
    person = null;
    state = null;
    renderStart();
  }
}

// ---------- START SCREEN ----------

function renderStart() {
  stopTimer();
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="display:flex; justify-content:center; gap:6px; margin-top:6px;">
      ${balloonSVG('A', '', '#F26A44', '#F7AD98')}
      ${balloonSVG('I', '', '#40BDA9', '#95DACF')}
      ${balloonSVG('R', '', '#4D88E8', '#9DBDF2')}
    </div>
    <h1 class="center" style="margin-top:2px;">Under Pressure</h1>
    <p class="center">A meeting roleplay in pairs. Choose which person you are.</p>
    <div class="card">
      <button class="person-btn" style="margin-bottom:12px;" onclick="choosePerson('person1')">Person 1</button>
      <button class="person-btn" onclick="choosePerson('person2')">Person 2</button>
    </div>
  `;
}

function choosePerson(p) {
  person = p;
  const existing = load(p);
  if (existing && !(existing.screen === 'done')) {
    const app = document.getElementById('app');
    app.innerHTML = `
      <h1>Welcome back</h1>
      <div class="resume-box">
        <p>You have saved progress for <b>${p === 'person1' ? 'Person 1' : 'Person 2'}</b>.</p>
        <button class="btn-primary" onclick="resumeSaved()">Continue where I left off</button>
        <button class="btn-outline" onclick="startFresh()">Start over instead</button>
      </div>
    `;
    return;
  }
  startFresh();
}

function resumeSaved() {
  state = load(person);
  renderCurrent();
}

function startFresh() {
  clearProgress(person);
  state = freshState();
  save();
  renderCurrent();
}

// ---------- ROUTER ----------

function renderCurrent() {
  if (state.screen === 'roundComplete') return renderRoundComplete();
  if (state.screen === 'review') return renderReview();
  if (state.screen === 'done') return renderDone();
  const role = roleFor(person, state.round);
  const steps = stepsFor(role);
  const step = steps[state.stepIndex];
  if (role === 'reader') return renderReaderStep(step);
  return renderResponderStep(step);
}

function stepLabel() {
  const role = roleFor(person, state.round);
  const steps = stepsFor(role);
  return `Round ${state.round} · Step ${state.stepIndex + 1} of ${steps.length}`;
}

function advanceStep() {
  const role = roleFor(person, state.round);
  const steps = stepsFor(role);
  if (state.stepIndex < steps.length - 1) {
    state.stepIndex += 1;
  } else {
    state.screen = 'roundComplete';
  }
  save();
  renderCurrent();
}

// ---------- READER FLOW ----------

function renderReaderStep(step) {
  const data = SCENARIOS[state.round].reader;
  const app = document.getElementById('app');

  if (step === 'info') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="role-line">${data.roleLine}</div>
      <div class="panel panel-teal">
        <div class="panel-title">What you know</div>
        <p class="panel-hint">Do not say this out loud yet.</p>
        <p>${data.whatYouKnow}</p>
      </div>
      <div class="panel panel-coral">
        <div class="panel-title">Your script</div>
        <p class="panel-hint">Read this out loud to your partner now.</p>
        <p><b>${data.script}</b></p>
      </div>
      <button class="btn-primary" onclick="advanceStep()">I've read my script to my partner</button>
      ${restartLink()}
    `;
  } else if (step === 'wait') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="card">
        <h2>Wait for your partner</h2>
        <p>Start the timer now, then let your partner respond. When they finish, share out loud what you know:</p>
      </div>
      <div class="timer-wrap">
        <div class="timer-display" id="timer-display">90<span class="unit">sec</span></div>
        <div class="timer-caption" id="timer-caption">Timer not started</div>
        <button class="btn-secondary" id="timer-btn" onclick="startTimer()" style="margin-top:10px;">Start 90 second timer</button>
      </div>
      <div class="panel panel-teal">
        <p>${data.whatYouKnow}</p>
      </div>
      <button class="btn-primary" onclick="advanceStep()">I've shared what I know</button>
      ${restartLink()}
    `;
  }
}

// ---------- RESPONDER FLOW ----------

function renderResponderStep(step) {
  const data = SCENARIOS[state.round].responder;
  const ans = state.answers[state.round];
  const app = document.getElementById('app');

  if (step === 'opening') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="role-line">${data.roleLine}</div>
      <div class="card">
        <p>Listen to your partner read their script out loud. Once they've finished, continue.</p>
      </div>
      <button class="btn-primary" onclick="advanceStep()">My partner has read their script — start</button>
      ${restartLink()}
    `;
  } else if (step === 'analyze') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="balloon-wrap">${balloonSVG('A', 'Analyze', '#F26A44', '#F7AD98')}</div>
      <div class="panel panel-analyze">
        <p>What do I know? What am I assuming?</p>
        <textarea id="input-analyze" placeholder="Type here...">${ans.analyze}</textarea>
      </div>
      <button class="btn-primary" onclick="saveAndAdvance('analyze', 'input-analyze')">Continue</button>
      ${restartLink()}
    `;
  } else if (step === 'involve') {
    const rows = data.involve.map((c, i) => `
      <div class="choice">
        <input type="checkbox" id="involve-${i}" value="${c.name}" ${ans.involveChecked.includes(c.name) ? 'checked' : ''}>
        <label for="involve-${i}"><b>${c.name}</b> — ${c.desc}</label>
      </div>
    `).join('');
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="balloon-wrap">${balloonSVG('I', 'Involve', '#40BDA9', '#95DACF')}</div>
      <div class="panel panel-involve">
        <p>Who would you bring in? You can pick one, two, or all three. Say why.</p>
        ${rows}
        <p style="margin-top:12px;">Why:</p>
        <textarea id="input-involve-reason" placeholder="Type your reason...">${ans.involveReason}</textarea>
      </div>
      <button class="btn-primary" onclick="saveInvolveAndAdvance()">Continue</button>
      ${restartLink()}
    `;
  } else if (step === 'respond') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="panel panel-coral">
        <div class="panel-title">Respond — say this out loud to your partner</div>
        <p class="panel-hint">Your partner is timing this. Aim to answer within 90 seconds.</p>
        <textarea id="input-respond" placeholder="Type here...">${ans.respond}</textarea>
      </div>
      <button class="btn-primary" onclick="saveAndAdvance('respond', 'input-respond')">I've given my response</button>
      ${restartLink()}
    `;
  } else if (step === 'wait') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="card">
        <h2>Listen to your partner</h2>
        <p>Your partner will now share what they knew that you didn't. Listen, then continue.</p>
      </div>
      <button class="btn-primary" onclick="advanceStep()">They've shared it — continue</button>
      ${restartLink()}
    `;
  } else if (step === 'reflect') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="balloon-wrap">${balloonSVG('R', 'Reflect', '#4D88E8', '#9DBDF2')}</div>
      <div class="panel panel-reflect">
        <p>I assumed ___, but actually ___. Next time I would involve or do ___.</p>
        <textarea id="input-reflect1" placeholder="Type here...">${ans.reflect1}</textarea>
        <p style="margin-top:14px;">Did involving the person you picked get you this, or did you still need it?</p>
        <textarea id="input-reflect2" placeholder="Type here...">${ans.reflect2}</textarea>
      </div>
      <button class="btn-primary" onclick="saveReflectAndAdvance()">Continue</button>
      ${restartLink()}
    `;
  }
}

function saveAndAdvance(field, elId) {
  state.answers[state.round][field] = document.getElementById(elId).value;
  save();
  advanceStep();
}

function saveInvolveAndAdvance() {
  const data = SCENARIOS[state.round].responder;
  const checked = [];
  data.involve.forEach((c, i) => {
    const el = document.getElementById('involve-' + i);
    if (el && el.checked) checked.push(c.name);
  });
  state.answers[state.round].involveChecked = checked;
  state.answers[state.round].involveReason = document.getElementById('input-involve-reason').value;
  save();
  advanceStep();
}

function saveReflectAndAdvance() {
  state.answers[state.round].reflect1 = document.getElementById('input-reflect1').value;
  state.answers[state.round].reflect2 = document.getElementById('input-reflect2').value;
  save();
  advanceStep();
}

// ---------- TIMER ----------

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function startTimer() {
  stopTimer();
  let remaining = 90;
  const display = document.getElementById('timer-display');
  const caption = document.getElementById('timer-caption');
  const btn = document.getElementById('timer-btn');
  if (!display) return;
  btn.disabled = true;
  btn.style.opacity = '0.5';
  caption.textContent = 'Aim to answer by the time this reaches 0';
  function tick() {
    display.innerHTML = remaining + '<span class="unit">sec</span>';
    if (remaining <= 20) display.classList.add('warn');
    if (remaining <= 0) {
      stopTimer();
      caption.textContent = "Time's up — finish your response now";
      return;
    }
    remaining -= 1;
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

// ---------- ROUND TRANSITION ----------

function renderRoundComplete() {
  stopTimer();
  const app = document.getElementById('app');
  if (state.round === 1) {
    app.innerHTML = `
      <h1>Round 1 complete</h1>
      <div class="card">
        <p>Well done. Now switch to Round 2 with the second scenario.</p>
      </div>
      <button class="btn-primary" onclick="goToRound2()">Continue to Round 2</button>
      ${restartLink()}
    `;
  } else {
    app.innerHTML = `
      <h1>Round 2 complete</h1>
      <div class="card">
        <p>Both rounds are done. Next, review your answers.</p>
      </div>
      <button class="btn-primary" onclick="goToReview()">Review my answers</button>
      ${restartLink()}
    `;
  }
}

function goToRound2() {
  state.round = 2;
  state.stepIndex = 0;
  state.screen = 'round';
  save();
  renderCurrent();
}

function goToReview() {
  state.screen = 'review';
  save();
  renderCurrent();
}

// ---------- REVIEW ----------

function reviewBlockFor(round) {
  const role = roleFor(person, round);
  if (role === 'reader') {
    return `
      <div class="review-block">
        <h2>Round ${round}</h2>
        <p style="color:#64748b;">You were the reader in this round. There are no typed answers to review.</p>
      </div>
    `;
  }
  const ans = state.answers[round];
  const involveNames = ans.involveChecked.length ? ans.involveChecked.join(', ') : '(none selected)';
  function line(q, a) {
    return `<div class="review-q">${q}</div><div class="review-a ${a ? '' : 'empty'}">${a || '(no answer typed)'}</div>`;
  }
  return `
    <div class="review-block">
      <h2>Round ${round}</h2>
      ${line('Analyze — what do I know, what am I assuming?', ans.analyze)}
      ${line('Involve — who, and why?', involveNames + (ans.involveReason ? ' — ' + ans.involveReason : ''))}
      ${line('Respond', ans.respond)}
      ${line('Reflect — I assumed / but actually / next time', ans.reflect1)}
      ${line('Reflect — did involving them get me this?', ans.reflect2)}
    </div>
  `;
}

function renderReview() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>Review your answers</h1>
    <div class="card">
      ${reviewBlockFor(1)}
      ${reviewBlockFor(2)}
    </div>
    <button class="btn-primary" onclick="finishActivity()">Finish</button>
    ${restartLink()}
  `;
}

function finishActivity() {
  state.screen = 'done';
  save();
  renderCurrent();
}

// ---------- DONE ----------

function renderDone() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>Activity complete</h1>
    <div class="card center">
      <p>Nice work. Return to your facilitator.</p>
    </div>
    ${restartLink()}
  `;
}

// ---------- INIT ----------

renderStart();
</script>
