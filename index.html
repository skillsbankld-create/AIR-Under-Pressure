<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIR Under Pressure — Meeting Roleplay</title>
<style>
  :root {
    --navy: #1B2A4A;
    --navy-dark: #0F1D33;
    --teal: #0D9488;
    --teal-panel: #F0FDFA;
    --coral: #F4845F;
    --coral-panel: #FFF1EB;
    --offwhite: #F8FAFC;
    --white: #FFFFFF;
    --text: #1B2A4A;
    --border: #D9E2EC;

    --analyze: #F26A44;
    --analyze-light: #F7AD98;
    --analyze-panel: #FDF0EC;
    --involve: #40BDA9;
    --involve-light: #95DACF;
    --involve-panel: #EBF8F6;
    --reflect: #4D88E8;
    --reflect-light: #9DBDF2;
    --reflect-panel: #EDF3FC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: Calibri, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--navy);
    color: var(--offwhite);
  }
  .header {
    background: var(--navy);
    padding: 14px 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .header img { height: 40px; }
  .lang-switch {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    direction: ltr;
  }
  .lang-switch button {
    width: auto;
    padding: 5px 14px;
    font-size: 0.82rem;
    border-radius: 20px;
    margin-top: 0;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.4);
    background: transparent;
    color: rgba(255,255,255,0.75);
    font-weight: normal;
  }
  .lang-switch button.active {
    background: var(--white);
    color: var(--navy);
    font-weight: bold;
    border-color: var(--white);
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 18px 80px;
  }
  h1 {
    font-size: 1.3rem;
    color: var(--white);
    margin: 0 0 6px;
  }
  h2 {
    font-size: 1.05rem;
    color: var(--navy);
    margin: 0 0 10px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .panel {
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .panel-teal { background: var(--teal-panel); }
  .panel-coral { background: var(--coral-panel); }
  .panel-analyze { background: var(--analyze-panel); }
  .panel-involve { background: var(--involve-panel); }
  .panel-reflect { background: var(--reflect-panel); }
  .panel-title {
    font-weight: bold;
    margin: 0 0 6px;
  }
  .panel-teal .panel-title { color: var(--teal); }
  .panel-coral .panel-title { color: var(--coral); }
  .panel p, .panel-hint { margin: 0 0 8px; }
  .panel-hint { font-style: italic; font-size: 0.88rem; color: #475569; }
  .balloon-wrap { text-align: center; margin-bottom: 6px; }
  .balloon-svg { width: 110px; height: 140px; display: inline-block; }
  .role-line {
    font-weight: bold;
    background: var(--offwhite);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 16px;
    color: var(--text);
  }
  textarea, .text-input {
    width: 100%;
    font-family: Calibri, "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: 0.98rem;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
    margin-top: 6px;
    background: var(--white);
    color: var(--text);
  }
  textarea { min-height: 70px; }
  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .choice:last-child { border-bottom: none; }
  .choice input[type=checkbox] {
    margin-top: 4px;
    width: 18px; height: 18px;
    flex-shrink: 0;
  }
  .choice label { font-size: 0.98rem; }
  .choice b { color: var(--navy); }
  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    padding: 13px 20px;
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
  }
  .btn-primary { background: var(--teal); color: var(--white); }
  .btn-primary:hover { background: #0b7a70; }
  .btn-secondary { background: #33507F; color: var(--white); border: 1px solid rgba(255,255,255,0.25); }
  .btn-secondary:hover { background: #3D5D92; }
  .btn-outline {
    background: transparent;
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.5);
    font-weight: normal;
  }
  .step-label {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
    font-weight: bold;
    letter-spacing: 0.02em;
  }
  .timer-wrap {
    text-align: center;
    margin: 14px 0;
  }
  .timer-display {
    font-size: 2.6rem;
    font-weight: bold;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
  }
  .timer-display .unit {
    font-size: 1.1rem;
    font-weight: normal;
    margin-left: 4px;
    margin-right: 4px;
  }
  .timer-display.warn { color: var(--coral); }
  .timer-caption {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.65);
    margin-top: 2px;
  }
  .restart-link {
    text-align: center;
    margin-top: 26px;
    font-size: 0.85rem;
  }
  .restart-link a { color: rgba(255,255,255,0.65); text-decoration: underline; cursor: pointer; }
  .center { text-align: center; }
  .resume-box {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    margin-top: 18px;
    color: var(--text);
  }
  .resume-box .btn-outline {
    color: var(--navy);
    border: 1px solid var(--border);
  }
  .person-btn {
    background: var(--white);
    border: 2px solid var(--navy);
    color: var(--navy);
    padding: 22px;
    font-size: 1.15rem;
  }
  .person-btn:hover { background: #33507F; color: var(--white); border-color: #33507F; }
  .review-block {
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .review-block:last-child { border-bottom: none; }
  .review-q { font-weight: bold; color: var(--navy); margin: 10px 0 2px; font-size: 0.92rem; }
  .review-a { margin: 0 0 6px; white-space: pre-wrap; }
  .review-a.empty { color: #94a3b8; font-style: italic; }
  .intro-list { margin: 0 0 16px; padding-inline-start: 20px; }
  .intro-list li { margin-bottom: 8px; font-size: 0.98rem; }
  .ltr-num { direction: ltr; unicode-bidi: embed; display: inline-block; }
</style>
</head>

function t(key) { return I18N[currentLang][key]; }

const NAME_AR = { Sara: 'سارة', Nadia: 'نادية', Omar: 'عمر', Farah: 'فرح', Khaled: 'خالد', Tariq: 'طارق' };
function displayName(englishName) {
  return currentLang === 'ar' ? (NAME_AR[englishName] || englishName) : englishName;
}

const ARABIC_DIGITS = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
function formatNumber(n) {
  const s = String(n);
  if (currentLang !== 'ar') return s;
  const converted = s.split('').map(ch => ARABIC_DIGITS[ch] || ch).join('');
  return '<span class="ltr-num">' + converted + '</span>';
}

function scenarioReaderData(round) {
  const p = 'scenario' + round;
  return {
    roleLine: t(p + 'ReaderRole'),
    whatYouKnow: t(p + 'WhatYouKnow'),
    script: t(p + 'Script'),
  };
}
function scenarioResponderData(round) {
  const p = 'scenario' + round;
  return { roleLine: t(p + 'ResponderRole'), counterpart: t(p + 'Counterpart') };
}
function scenarioInvolveData(round) {
  if (round === 1) {
    return [
      { name: 'Sara', desc: t('descSara1') },
      { name: 'Nadia', desc: t('descNadia1') },
      { name: 'Omar', desc: t('descOmar1') },
    ];
  }
  return [
    { name: 'Farah', desc: t('descFarah2') },
    { name: 'Khaled', desc: t('descKhaled2') },
    { name: 'Tariq', desc: t('descTariq2') },
  ];
}

const PERSON_ROLES = {
  person1: {1: 'reader', 2: 'responder'},
  person2: {1: 'responder', 2: 'reader'}
};

const READER_STEPS = ['info', 'wait'];
const RESPONDER_STEPS = ['opening', 'analyze', 'involve', 'respond', 'wait', 'reflect'];

let currentLang = (function () {
  try { return localStorage.getItem('airActivity_lang') || 'en'; } catch (e) { return 'en'; }
})();
let currentView = 'intro'; // 'intro' | 'personSelect' | 'resumePrompt' | 'activity'
let person = null;
let state = null;
let timerInterval = null;
let timerState = { remaining: 90, running: false, warn: false, finished: false };

// ---------- BALLOON SVG ----------

function balloonSVG(letter, label, color, lightColor) {
  const gid = 'grad-' + letter + '-' + color.replace('#', '');
  return `
    <svg class="balloon-svg" viewBox="0 0 140 175" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${lightColor}"/>
          <stop offset="100%" stop-color="${color}"/>
        </linearGradient>
      </defs>
      <path d="M70,6 C106,6 124,34 124,66 C124,106 94,138 70,150 C46,138 16,106 16,66 C16,34 34,6 70,6 Z" fill="url(#${gid})"/>
      <line x1="70" y1="150" x2="70" y2="166" stroke="${color}" stroke-width="3"/>
      <circle cx="70" cy="170" r="5" fill="${color}"/>
      <text x="70" y="${label ? 66 : 76}" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff" font-family="Calibri, Arial, sans-serif">${letter}</text>
      ${label ? `<text x="70" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" font-family="Calibri, Arial, sans-serif">${label}</text>` : ''}
    </svg>
  `;
}

// ---------- STORAGE ----------

function storageKey(p) { return 'airActivity_' + p; }

function freshState() {
  return {
    round: 1,
    stepIndex: 0,
    screen: 'round',
    answers: {
      1: { analyze: '', involveChecked: [], involveReason: '', respond: '', reflect1: '', reflect2: '' },
      2: { analyze: '', involveChecked: [], involveReason: '', respond: '', reflect1: '', reflect2: '' }
    }
  };
}

function save() {
  localStorage.setItem(storageKey(person), JSON.stringify(state));
}

function load(p) {
  const raw = localStorage.getItem(storageKey(p));
  return raw ? JSON.parse(raw) : null;
}

function clearProgress(p) {
  localStorage.removeItem(storageKey(p));
}

function roleFor(p, round) {
  return PERSON_ROLES[p][round];
}

function stepsFor(role) {
  return role === 'reader' ? READER_STEPS : RESPONDER_STEPS;
}

function restartLink() {
  return '<div class="restart-link"><a onclick="doRestart()">' + t('restartLink') + '</a></div>';
}

function doRestart() {
  if (confirm(t('restartConfirm'))) {
    clearProgress(person);
    person = null;
    state = null;
    renderIntro();
  }
}

// ---------- LANGUAGE SWITCH ----------

function captureCurrentInputs() {
  if (!state) return;
  const ans = state.answers[state.round];
  const a = document.getElementById('input-analyze');
  if (a) ans.analyze = a.value;
  const ir = document.getElementById('input-involve-reason');
  if (ir) ans.involveReason = ir.value;
  const resp = document.getElementById('input-respond');
  if (resp) ans.respond = resp.value;
  const r1 = document.getElementById('input-reflect1');
  if (r1) ans.reflect1 = r1.value;
  const r2 = document.getElementById('input-reflect2');
  if (r2) ans.reflect2 = r2.value;
  let sawCheckboxes = false;
  const checked = [];
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById('involve-' + i);
    if (el) { sawCheckboxes = true; if (el.checked) checked.push(el.value); }
  }
  if (sawCheckboxes) ans.involveChecked = checked;
  save();
}

function updateLangSwitchUI() {
  const enBtn = document.getElementById('lang-en-btn');
  const arBtn = document.getElementById('lang-ar-btn');
  if (!enBtn || !arBtn) return;
  enBtn.classList.toggle('active', currentLang === 'en');
  arBtn.classList.toggle('active', currentLang === 'ar');
}

function switchLanguage(newLang) {
  if (newLang === currentLang) return;
  captureCurrentInputs();
  currentLang = newLang;
  try { localStorage.setItem('airActivity_lang', currentLang); } catch (e) {}
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('pageTitle');
  updateLangSwitchUI();
  rerenderCurrentView();
}

function rerenderCurrentView() {
  if (currentView === 'intro') return renderIntro();
  if (currentView === 'personSelect') return renderPersonSelect();
  if (currentView === 'resumePrompt') return renderResumePrompt();
  return renderCurrent();
}

// ---------- START SCREEN ----------

function renderIntro() {
  stopTimer();
  currentView = 'intro';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div dir="ltr" style="display:flex; justify-content:center; gap:6px; margin-top:6px;">
      ${balloonSVG('A', '', '#F26A44', '#F7AD98')}
      ${balloonSVG('I', '', '#40BDA9', '#95DACF')}
      ${balloonSVG('R', '', '#4D88E8', '#9DBDF2')}
    </div>
    <h1 class="center" style="margin-top:2px;">${t('introHeading')}</h1>
    <div class="card">
      <h2>${t('howThisWorks')}</h2>
      <ul class="intro-list">
        <li>${t('introBullet1')}</li>
        <li>${t('introBullet2')}</li>
        <li>${t('introBullet3')}</li>
        <li>${t('introBullet4')}</li>
      </ul>
      <button class="btn-primary" onclick="renderPersonSelect()">${t('introStartBtn')}</button>
    </div>
  `;
}

function renderPersonSelect() {
  stopTimer();
  currentView = 'personSelect';
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1 class="center">${t('chooseRoleHeading')}</h1>
    <p class="center">${t('choosePersonText')}</p>
    <div class="card">
      <button class="person-btn" style="margin-bottom:12px;" onclick="choosePerson('person1')">${t('person1')}</button>
      <button class="person-btn" onclick="choosePerson('person2')">${t('person2')}</button>
    </div>
  `;
}

function choosePerson(p) {
  person = p;
  const existing = load(p);
  if (existing && !(existing.screen === 'done')) {
    renderResumePrompt();
    return;
  }
  startFresh();
}

function renderResumePrompt() {
  currentView = 'resumePrompt';
  const app = document.getElementById('app');
  const savedLine = person === 'person1' ? t('savedProgress1') : t('savedProgress2');
  app.innerHTML = `
    <h1>${t('welcomeBack')}</h1>
    <div class="resume-box">
      <p>${savedLine}</p>
      <button class="btn-primary" onclick="resumeSaved()">${t('continueWhereLeftOff')}</button>
      <button class="btn-outline" onclick="startFresh()">${t('startOverInstead')}</button>
    </div>
  `;
}

function resumeSaved() {
  currentView = 'activity';
  state = load(person);
  renderCurrent();
}

function startFresh() {
  currentView = 'activity';
  clearProgress(person);
  state = freshState();
  save();
  renderCurrent();
}

// ---------- ROUTER ----------

function renderCurrent() {
  if (state.screen === 'roundComplete') return renderRoundComplete();
  if (state.screen === 'review') return renderReview();
  if (state.screen === 'done') return renderDone();
  const role = roleFor(person, state.round);
  const steps = stepsFor(role);
  const step = steps[state.stepIndex];
  if (role === 'reader') return renderReaderStep(step);
  return renderResponderStep(step);
}

function stepLabel() {
  const role = roleFor(person, state.round);
  const steps = stepsFor(role);
  const roleTag = role === 'reader' ? t('roleReader') : t('roleResponder');
  return `${t('roundWord')} ${formatNumber(state.round)} · ${roleTag} · ${t('stepWord')} ${formatNumber(state.stepIndex + 1)} ${t('ofWord')} ${formatNumber(steps.length)}`;
}

function advanceStep() {
  const role = roleFor(person, state.round);
  const steps = stepsFor(role);
  if (state.stepIndex < steps.length - 1) {
    state.stepIndex += 1;
  } else {
    state.screen = 'roundComplete';
  }
  save();
  renderCurrent();
}

// ---------- READER FLOW ----------

function renderReaderStep(step) {
  const data = scenarioReaderData(state.round);
  const app = document.getElementById('app');

  if (step === 'info') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="role-line">${data.roleLine}</div>
      <div class="panel panel-teal">
        <div class="panel-title">${t('whatYouKnowTitle')}</div>
        <p class="panel-hint">${t('whatYouKnowHint')}</p>
        <p>${data.whatYouKnow}</p>
      </div>
      <div class="panel panel-coral">
        <div class="panel-title">${t('yourScriptTitle')}</div>
        <p class="panel-hint">${t('yourScriptHint')}</p>
        <p><b>${data.script}</b></p>
      </div>
      <button class="btn-primary" onclick="advanceStep()">${t('readScriptBtn')}</button>
      ${restartLink()}
    `;
  } else if (step === 'wait') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="card">
        <h2>${t('readerWaitHeading')}</h2>
        <p>${t('readerWaitBody')}</p>
      </div>
      ${timerBlockHTML()}
      <div class="panel panel-teal">
        <p>${data.whatYouKnow}</p>
      </div>
      <button class="btn-primary" onclick="advanceStep()">${t('sharedKnowledgeBtn')}</button>
      ${restartLink()}
    `;
  }
}

// ---------- RESPONDER FLOW ----------

function renderResponderStep(step) {
  const data = scenarioResponderData(state.round);
  const ans = state.answers[state.round];
  const app = document.getElementById('app');

  if (step === 'opening') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="role-line">${data.roleLine}</div>
      <div class="card">
        <p><b>${data.counterpart}</b></p>
        <p>${t('listenInstructions')}</p>
      </div>
      <button class="btn-primary" onclick="advanceStep()">${t('partnerReadStartBtn')}</button>
      ${restartLink()}
    `;
  } else if (step === 'analyze') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="balloon-wrap">${balloonSVG('A', t('balloonAnalyze'), '#F26A44', '#F7AD98')}</div>
      <div class="panel panel-analyze">
        <p>${t('analyzeQuestion')}</p>
        <p class="panel-hint">${t('analyzeHint')}</p>
        <textarea id="input-analyze" placeholder="${t('typeHere')}">${ans.analyze}</textarea>
      </div>
      <button class="btn-primary" onclick="saveAndAdvance('analyze', 'input-analyze')">${t('continueBtn')}</button>
      ${restartLink()}
    `;
  } else if (step === 'involve') {
    const involveData = scenarioInvolveData(state.round);
    const rows = involveData.map((c, i) => `
      <div class="choice">
        <input type="checkbox" id="involve-${i}" value="${c.name}" ${ans.involveChecked.includes(c.name) ? 'checked' : ''}>
        <label for="involve-${i}"><b>${displayName(c.name)}</b> — ${c.desc}</label>
      </div>
    `).join('');
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="balloon-wrap">${balloonSVG('I', t('balloonInvolve'), '#40BDA9', '#95DACF')}</div>
      <div class="panel panel-involve">
        <p>${t('involveQuestion')}</p>
        ${rows}
        <p style="margin-top:12px;">${t('whyLabel')}</p>
        <textarea id="input-involve-reason" placeholder="${t('involveReasonPlaceholder')}">${ans.involveReason}</textarea>
      </div>
      <button class="btn-primary" onclick="saveInvolveAndAdvance()">${t('continueBtn')}</button>
      ${restartLink()}
    `;
  } else if (step === 'respond') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="panel panel-coral">
        <div class="panel-title">${t('respondTitle')}</div>
        <p class="panel-hint">${t('respondHint')}</p>
        <textarea id="input-respond" placeholder="${t('respondPlaceholder')}">${ans.respond}</textarea>
      </div>
      <button class="btn-primary" onclick="saveAndAdvance('respond', 'input-respond')">${t('respondDoneBtn')}</button>
      ${restartLink()}
    `;
  } else if (step === 'wait') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="card">
        <h2>${t('listenHeading')}</h2>
        <p>${t('listenBody')}</p>
      </div>
      <button class="btn-primary" onclick="advanceStep()">${t('listenDoneBtn')}</button>
      ${restartLink()}
    `;
  } else if (step === 'reflect') {
    app.innerHTML = `
      <div class="step-label">${stepLabel()}</div>
      <div class="balloon-wrap">${balloonSVG('R', t('balloonReflect'), '#4D88E8', '#9DBDF2')}</div>
      <div class="panel panel-reflect">
        <p>${t('reflectPrompt1')}</p>
        <textarea id="input-reflect1" placeholder="${t('typeHere')}">${ans.reflect1}</textarea>
        <p style="margin-top:14px;">${t('reflectPrompt2')}</p>
        <textarea id="input-reflect2" placeholder="${t('typeHere')}">${ans.reflect2}</textarea>
      </div>
      <button class="btn-primary" onclick="saveReflectAndAdvance()">${t('continueBtn')}</button>
      ${restartLink()}
    `;
  }
}

function saveAndAdvance(field, elId) {
  state.answers[state.round][field] = document.getElementById(elId).value;
  save();
  advanceStep();
}

function saveInvolveAndAdvance() {
  const involveData = scenarioInvolveData(state.round);
  const checked = [];
  involveData.forEach((c, i) => {
    const el = document.getElementById('involve-' + i);
    if (el && el.checked) checked.push(c.name);
  });
  state.answers[state.round].involveChecked = checked;
  state.answers[state.round].involveReason = document.getElementById('input-involve-reason').value;
  save();
  advanceStep();
}

function saveReflectAndAdvance() {
  state.answers[state.round].reflect1 = document.getElementById('input-reflect1').value;
  state.answers[state.round].reflect2 = document.getElementById('input-reflect2').value;
  save();
  advanceStep();
}

// ---------- TIMER ----------

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerState = { remaining: 90, running: false, warn: false, finished: false };
}

function timerCaptionText() {
  if (timerState.finished) return t('timerUpCaption');
  if (timerState.running) return t('timerAimCaption');
  return t('timerNotStarted');
}

function timerBlockHTML() {
  const disabledAttr = (timerState.running || timerState.finished) ? 'disabled' : '';
  const opacityStyle = (timerState.running || timerState.finished) ? 'opacity:0.5;' : '';
  return `
    <div class="timer-wrap">
      <div class="timer-display ${timerState.warn ? 'warn' : ''}" id="timer-display">${formatNumber(timerState.remaining)}<span class="unit">${t('timerUnit')}</span></div>
      <div class="timer-caption" id="timer-caption">${timerCaptionText()}</div>
      <button class="btn-secondary" id="timer-btn" onclick="startTimer()" style="margin-top:10px; ${opacityStyle}" ${disabledAttr}>${t('startTimerBtn')}</button>
    </div>
  `;
}

function updateTimerDOM() {
  const display = document.getElementById('timer-display');
  const caption = document.getElementById('timer-caption');
  const btn = document.getElementById('timer-btn');
  if (!display) return;
  display.innerHTML = formatNumber(timerState.remaining) + '<span class="unit">' + t('timerUnit') + '</span>';
  display.classList.toggle('warn', timerState.warn);
  if (btn) {
    btn.disabled = timerState.running || timerState.finished;
    btn.style.opacity = (timerState.running || timerState.finished) ? '0.5' : '1';
    btn.textContent = t('startTimerBtn');
  }
  if (caption) caption.textContent = timerCaptionText();
}

function startTimer() {
  if (timerState.running || timerState.finished) return;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerState.running = true;
  timerState.remaining = 90;
  timerState.warn = false;
  timerState.finished = false;
  updateTimerDOM();
  timerInterval = setInterval(() => {
    timerState.remaining -= 1;
    if (timerState.remaining <= 20) timerState.warn = true;
    if (timerState.remaining <= 0) {
      timerState.remaining = 0;
      timerState.running = false;
      timerState.finished = true;
      clearInterval(timerInterval);
      timerInterval = null;
    }
    updateTimerDOM();
  }, 1000);
}

// ---------- ROUND TRANSITION ----------

function renderRoundComplete() {
  stopTimer();
  const app = document.getElementById('app');
  if (state.round === 1) {
    app.innerHTML = `
      <h1>${t('round1CompleteHeading')}</h1>
      <div class="card">
        <p>${t('round1CompleteBody')}</p>
      </div>
      <button class="btn-primary" onclick="goToRound2()">${t('continueRound2Btn')}</button>
      ${restartLink()}
    `;
  } else {
    app.innerHTML = `
      <h1>${t('round2CompleteHeading')}</h1>
      <div class="card">
        <p>${t('round2CompleteBody')}</p>
      </div>
      <button class="btn-primary" onclick="goToReview()">${t('reviewAnswersBtn')}</button>
      ${restartLink()}
    `;
  }
}

function goToRound2() {
  state.round = 2;
  state.stepIndex = 0;
  state.screen = 'round';
  save();
  renderCurrent();
}

function goToReview() {
  state.screen = 'review';
  save();
  renderCurrent();
}

// ---------- REVIEW ----------

function reviewBlockFor(round) {
  const role = roleFor(person, round);
  const roundHeading = `${t('roundWord')} ${formatNumber(round)}`;
  if (role === 'reader') {
    return `
      <div class="review-block">
        <h2>${roundHeading}</h2>
        <p style="color:#64748b;">${t('readerNoAnswers')}</p>
      </div>
    `;
  }
  const ans = state.answers[round];
  const involveNames = ans.involveChecked.length ? ans.involveChecked.map(displayName).join(', ') : t('noneSelected');
  function line(q, a) {
    return `<div class="review-q">${q}</div><div class="review-a ${a ? '' : 'empty'}">${a || t('noAnswerTyped')}</div>`;
  }
  return `
    <div class="review-block">
      <h2>${roundHeading}</h2>
      ${line(t('reviewQAnalyze'), ans.analyze)}
      ${line(t('reviewQInvolve'), involveNames + (ans.involveReason ? ' — ' + ans.involveReason : ''))}
      ${line(t('reviewQRespond'), ans.respond)}
      ${line(t('reviewQReflect1'), ans.reflect1)}
      ${line(t('reviewQReflect2'), ans.reflect2)}
    </div>
  `;
}

function renderReview() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>${t('reviewHeading')}</h1>
    <div class="card">
      ${reviewBlockFor(1)}
      ${reviewBlockFor(2)}
    </div>
    <button class="btn-primary" onclick="finishActivity()">${t('finishBtn')}</button>
    ${restartLink()}
  `;
}

function finishActivity() {
  state.screen = 'done';
  save();
  renderCurrent();
}

// ---------- DONE ----------

function renderDone() {
  stopTimer();
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>${t('doneHeading')}</h1>
    <div class="card center">
      <p>${t('doneBody')}</p>
    </div>
    ${restartLink()}
  `;
}

// ---------- INIT ----------

document.documentElement.lang = currentLang;
document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
document.title = t('pageTitle');
updateLangSwitchUI();
renderIntro();
</script>
